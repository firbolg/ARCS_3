          - text: "Arc 6: Git & GitHub"
            href: arcs/arc_6.qmd
          - text: "Arc 7: DESeq2 Pipeline"
            href: arcs/arc_7.qmd
          - text: "Arc 8: Apptainer & Containers"
            href: arcs/arc_8.qmd
      - text: "About"
        href: index.qmd
      - text: "Schedule"
        href: schedule.qmd
      - text: "Setup"
        href: arcs/arc_0.qmd
      - text: "Glossary"
        href: glossary.qmd
