project:
  type: website
  output-dir: docs
  render:
    - "**/*.qmd"
    - "!workshops/*_codespaces.md"
    - "!workshops/05-tidyverse_workshop.qmd"

website:
  title: "ARCS"
  description: "Advancing Reproducibility with Computational Skills"

  navbar:
    left:
      - text: "Schedule"
        href: schedule.qmd
      - text: "Setup"
        href: session_0.qmd
      - text: "Sessions"
        menu:
          - text: "1. R in a Reproducible Project"
            href: sessions/session_1.qmd
          - text: "2. Control Flow, Functions, & Documents"
            href: sessions/session_2.qmd
          - text: "3. Data Transformation & Version Control"
            href: sessions/session_3.qmd
          - text: "4. Pipelines, Environments, & AI"
            href: sessions/session_4.qmd
      - text: "Archive"
        href: archive/index.qmd
    right:
      - icon: github
        href: https://github.com/CWML/ARCS

  sidebar:
    - id: sessions
      title: "Sessions"
      style: "docked"
      background: light
      contents:
            - text: "1. R in a Reproducible Project"
              href: sessions/session_1.qmd
            - text: "2. Control Flow, Functions, & Documents"
              href: sessions/session_2.qmd
            - text: "3. Data Transformation & Version Control"
              href: sessions/session_3.qmd
            - text: "4. Pipelines, Environments, & AI"
              href: sessions/session_4.qmd

  page-footer:
    left: "ARCS Workshop Series"
    right: "Built with [Quarto](https://quarto.org)"

format:
  html:
    include-in-header:
      - _includes/google_analytics.html
    theme:
      - cosmo
      - brand
    css: styles.css
    toc: true