  output-dir: docs
  render:
    - "**/*.qmd"
    - "!workshops/*_codespaces.md"
    - "!workshops/05-tidyverse_workshop.qmd"

website:
  title: "ARCS"
  description: "Advancing Reproducibility with Computational Skills"

  navbar:
    logo: images/arcs-logo.svg
    title: false
    left:
      - text: "ARCS"
        menu:
          - text: "Arc 1: R Fundamentals"
            href: arcs/arc_1.qmd
          - text: "Arc 2: Your First Reproducible Project"
