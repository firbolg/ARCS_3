            href: workshops/03-structures.qmd
          - text: "Reports"
            href: workshops/04-reports.qmd
          - text: "Tidyverse"
            href: workshops/05-tidyverse.qmd
          - text: "Git & Version Control"
            href: workshops/06-git.qmd
